<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My eBay Inventory</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e0d8;--ac:#2f6f4f;--acx:#fff;--bad:#b3261e;--sold:#e7f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f0efe9;--mut:#a3a29a;--bd:#3a3a36;--ac:#6fc59a;--acx:#10231a;--bad:#f2928b;--sold:#1d2b23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f0efe9;--mut:#a3a29a;--bd:#3a3a36;--ac:#6fc59a;--acx:#10231a;--bad:#f2928b;--sold:#1d2b23;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.2rem}.stat span{color:var(--mut);font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input,select{min-width:0}
button{cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.link{border:0;background:none;color:var(--ac);padding:6px 8px}
button.del{color:var(--bad)}
#q{flex:1 1 180px}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px;display:none;gap:8px;grid-template-columns:1fr 1fr}
form.open{display:grid}
form .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:2px}
form input,form select{width:100%}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.item.sold{background:var(--sold)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:600}
.loc{color:var(--mut);font-size:.9rem;margin:2px 0 6px}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.profit{font-weight:600}.neg{color:var(--bad)}
.acts{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<main>
<h1>My eBay Inventory</h1>
<div class="stats" id="stats"></div>
<div class="row">
  <input id="q" type="search" placeholder="Search name or location…">
  <select id="f"><option value="all">All items</option><option value="stock">In stock</option><option value="sold">Sold</option></select>
  <button class="pri" id="add">+ Add item</button>
</div>
<form id="form">
  <div class="w"><label>Item</label><input id="name" required placeholder="e.g. Vintage Pyrex bowl"></div>
  <div class="w"><label>Where is it? (shelf, bin, box…)</label><input id="loc" placeholder="e.g. Garage shelf 2, blue bin"></div>
  <div><label>Paid ($)</label><input id="paid" type="number" step="0.01" min="0" inputmode="decimal"></div>
  <div><label>Sold for ($)</label><input id="sold" type="number" step="0.01" min="0" inputmode="decimal" placeholder="blank if unsold"></div>
  <div><label>Fees + shipping ($)</label><input id="fees" type="number" step="0.01" min="0" inputmode="decimal"></div>
  <div><label>Date bought</label><input id="date" type="date"></div>
  <div class="w row" style="margin:0"><button type="button" class="pri" id="save">Save item</button><button type="button" id="cancel">Cancel</button></div>
</form>
<div id="list"></div>
<div class="row" style="margin-top:14px"><button id="export">Download spreadsheet (CSV)</button></div>
<p class="empty" id="note" style="padding:0;font-size:.8rem">Items are saved on this device in this browser. Use the download button now and then as a backup.</p>
</main>
<script>
const KEY="ebay-inventory-v1";
let items=[],editId=null;
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
const $=id=>document.getElementById(id);
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toFixed(2);
const num=v=>v===""||v==null?null:parseFloat(v);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function profit(i){return i.sold==null?null:i.sold-(i.paid||0)-(i.fees||0)}
function render(){
  const q=$("q").value.toLowerCase(),f=$("f").value;
  const stock=items.filter(i=>i.sold==null),done=items.filter(i=>i.sold!=null);
  const invested=stock.reduce((s,i)=>s+(i.paid||0),0);
  const sales=done.reduce((s,i)=>s+i.sold,0);
  const pr=done.reduce((s,i)=>s+profit(i),0);
  $("stats").innerHTML=[["In stock",stock.length],["Money in stock",money(invested)],["Total sales",money(sales)],["Profit",money(pr)]]
    .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  const list=items.filter(i=>(f==="all"||(f==="stock")===(i.sold==null))&&(i.name+" "+i.loc).toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
  $("list").innerHTML=list.length?list.map(i=>{
    const p=profit(i);
    return `<div class="item ${i.sold!=null?"sold":""}"><div class="top"><span class="name">${esc(i.name)}</span><span>${i.sold!=null?"Sold":"In stock"}</span></div>
    <div class="loc">📍 ${esc(i.loc||"No location yet")}</div>
    <div class="nums"><span>Paid ${i.paid!=null?money(i.paid):"—"}</span>${i.sold!=null?`<span>Sold ${money(i.sold)}</span><span>Fees ${money(i.fees||0)}</span><span class="profit ${p<0?"neg":""}">Profit ${money(p)}</span>`:""}</div>
    <div class="acts"><button class="link" data-a="edit" data-id="${i.id}">Edit</button>${i.sold==null?`<button class="link" data-a="sell" data-id="${i.id}">Mark sold</button>`:""}<button class="link del" data-a="del" data-id="${i.id}">Delete</button></div></div>`}).join("")
    :`<div class="empty">${items.length?"Nothing matches.":"No items yet. Tap “Add item” to start."}</div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openForm(i){
  editId=i?i.id:null;
  $("name").value=i?i.name:"";$("loc").value=i?i.loc:"";$("paid").value=i&&i.paid!=null?i.paid:"";
  $("sold").value=i&&i.sold!=null?i.sold:"";$("fees").value=i&&i.fees!=null?i.fees:"";
  $("date").value=i?i.date||"":new Date().toISOString().slice(0,10);
  $("form").classList.add("open");$("name").focus();
}
$("add").onclick=()=>openForm();
$("cancel").onclick=()=>$("form").classList.remove("open");
$("save").onclick=()=>{
  const name=$("name").value.trim();
  if(!name){$("name").focus();return}
  const d={name,loc:$("loc").value.trim(),paid:num($("paid").value),sold:num($("sold").value),fees:num($("fees").value),date:$("date").value};
  if(editId){items=items.map(i=>i.id===editId?{...i,...d}:i)}else{items.push({id:Date.now(),...d})}
  persist();$("form").classList.remove("open");render();
};
$("list").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=+b.dataset.id,i=items.find(x=>x.id===id);
  if(b.dataset.a==="edit")openForm(i);
  if(b.dataset.a==="sell"){openForm(i);$("sold").focus()}
  if(b.dataset.a==="del"&&confirm("Delete “"+i.name+"”?")){items=items.filter(x=>x.id!==id);persist();render()}
};
$("q").oninput=render;$("f").onchange=render;
$("export").onclick=async()=>{
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["Item","Location","Paid","Sold for","Fees+shipping","Profit","Date bought"]].concat(items.map(i=>[i.name,i.loc,i.paid,i.sold,i.fees,profit(i),i.date]));
  const csv=rows.map(r=>r.map(q).join(",")).join("\n");
  try{
    const dl=await claude.use("downloads");
    if(dl){await dl.save({filename:"ebay-inventory.csv",data:csv});return}
  }catch(e){}
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ebay-inventory.csv";a.click();
  }catch(e){}
};
render();
</script>
</body>
</html>
